<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b0f3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>FLIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
  body{
    background:#160a33;
    font-family:'Fredoka','Baloo 2',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:#fff; user-select:none; -webkit-user-select:none;
  }
  #wrap{position:fixed;inset:0}
  canvas{position:absolute;inset:0;display:block}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute;top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    pointer-events:none;opacity:0;transition:opacity .25s;
    font-variant-numeric:tabular-nums
  }
  #hud.on{opacity:1}
  .stat{line-height:1.05;min-width:0;white-space:nowrap}
  .stat .k{font-size:11px;font-weight:600;letter-spacing:.14em;opacity:.55;text-transform:uppercase}
  .stat .v{font-size:clamp(19px,6.4vw,30px);font-weight:700;text-shadow:0 3px 14px rgba(0,0,0,.45)}
  .stat.mid{text-align:center}
  .stat.mid .v{font-size:clamp(16px,4.8vw,22px);color:#ffd85e}
  .stat.right{text-align:right}
  .stat.right .v{font-size:clamp(16px,4.8vw,22px);opacity:.85}

  #pu{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    display:none;align-items:center;gap:9px;
    background:rgba(10,4,32,.55);border:1.5px solid rgba(255,255,255,.18);
    padding:8px 14px;border-radius:999px;backdrop-filter:blur(8px);
    font-size:14px;font-weight:600;letter-spacing:.04em;pointer-events:none;white-space:nowrap
  }
  #pu.on{display:flex}
  #puBar{width:64px;height:6px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
  #puFill{height:100%;width:100%;border-radius:99px;background:#fff;transition:width .1s linear}

  #hint{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.5)
  }
  #hint.on{opacity:.6;animation:hintPulse 1.6s ease-in-out infinite}
  @keyframes hintPulse{0%,100%{opacity:.35}50%{opacity:.8}}

  #banner{
    position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;
    font-size:clamp(22px,7vw,38px);font-weight:700;letter-spacing:.03em;
    opacity:0;transform:scale(.8);color:#fff;text-shadow:0 0 26px rgba(255,214,94,.75),0 6px 18px rgba(0,0,0,.5)
  }
  #banner.go{animation:bannerPop 1.9s cubic-bezier(.2,.9,.25,1) forwards}
  @keyframes bannerPop{
    0%{opacity:0;transform:scale(.7)}
    14%{opacity:1;transform:scale(1.08)}
    24%{transform:scale(1)}
    72%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.05) translateY(-14px)}
  }

  #sound{
    position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);
    background:rgba(10,4,32,.4);color:#fff;font-size:17px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);z-index:6
  }
  /* During a run every tap must flip. The mute button lives on the menus only,
     so a thumb resting in the bottom-right corner can't hit it mid-game. */
  body.playing #sound{display:none}

  /* ---------- Overlays ---------- */
  .screen{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    padding:26px;z-index:5;
    background:radial-gradient(120% 80% at 50% 42%,rgba(22,10,51,.72),rgba(10,4,26,.94))
  }
  .screen.on{display:flex;animation:fade .3s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .logo{display:flex;gap:2px;margin-bottom:6px}
  .logo span{
    font-size:clamp(56px,19vw,110px);font-weight:700;line-height:.9;
    display:inline-block;animation:letter 2.4s ease-in-out infinite;
    text-shadow:0 8px 0 rgba(0,0,0,.18),0 0 40px rgba(94,234,255,.35)
  }
  .logo span:nth-child(1){color:#5eeaff;animation-delay:0s}
  .logo span:nth-child(2){color:#ffd85e;animation-delay:.12s}
  .logo span:nth-child(3){color:#ff7ac4;animation-delay:.24s}
  .logo span:nth-child(4){color:#9dff6a;animation-delay:.36s}
  @keyframes letter{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-13px) rotate(-4deg)}}

  .tag{font-size:14px;font-weight:500;opacity:.7;letter-spacing:.05em;max-width:330px;line-height:1.5;margin-bottom:26px}
  .rules{display:flex;gap:16px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
  .rule{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;opacity:.85}
  .swatch{width:15px;height:15px;border-radius:50%}

  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:700;
    font-size:clamp(19px,5.2vw,25px);letter-spacing:.05em;color:#20104a;
    padding:17px 46px;border-radius:999px;
    background:linear-gradient(180deg,#ffe98a,#ffc93c);
    box-shadow:0 7px 0 #d99a12,0 14px 30px rgba(0,0,0,.4);
    transition:transform .1s,box-shadow .1s;animation:btnBob 2.6s ease-in-out infinite
  }
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #d99a12,0 8px 18px rgba(0,0,0,.4);animation:none}
  @keyframes btnBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  #goTitle{font-size:clamp(34px,11vw,60px);font-weight:700;letter-spacing:.02em;line-height:1}
  #goTitle.rec{color:#ffd85e;text-shadow:0 0 34px rgba(255,216,94,.8);animation:recPop .7s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes recPop{0%{transform:scale(.5) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  #goSub{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.5;margin-top:12px}
  #goScore{font-size:clamp(58px,19vw,96px);font-weight:700;line-height:1;margin:2px 0 18px;
    background:linear-gradient(180deg,#fff,#b7a6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #goStats{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
  .chip{
    background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.13);
    border-radius:16px;padding:10px 18px;min-width:88px
  }
  .chip .k{font-size:10px;font-weight:600;letter-spacing:.15em;opacity:.55;text-transform:uppercase}
  .chip .v{font-size:22px;font-weight:700;margin-top:2px}
  #goBest .v{color:#ffd85e}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="stat"><div class="k">Score</div><div class="v" id="hScore">0</div></div>
    <div class="stat mid"><div class="k">Level</div><div class="v" id="hLevel">1</div></div>
    <div class="stat right"><div class="k">Best</div><div class="v" id="hBest">0</div></div>
  </div>

  <div id="pu"><span id="puIcon">⚡</span><span id="puName">SPEED</span><div id="puBar"><div id="puFill"></div></div></div>
  <div id="hint">Tap to flip</div>
  <div id="banner"></div>
  <button id="sound" aria-label="Toggle sound">🔊</button>

  <!-- START -->
  <div class="screen on" id="scStart">
    <div class="logo"><span>F</span><span>L</span><span>I</span><span>P</span></div>
    <div class="tag">Bloop never stops running.<br>Tap anywhere to flip direction.</div>
    <div class="rules">
      <div class="rule"><span class="swatch" style="background:#5eeaff;box-shadow:0 0 12px #5eeaff"></span>Collect dots</div>
      <div class="rule"><span class="swatch" style="background:#ff3b5c;box-shadow:0 0 12px #ff3b5c;border-radius:4px"></span>Dodge red</div>
    </div>
    <button class="btn" id="btnPlay">PLAY</button>
  </div>

  <!-- GAME OVER -->
  <div class="screen" id="scOver">
    <div id="goTitle">GAME OVER</div>
    <div id="goSub">Score</div>
    <div id="goScore">0</div>
    <div id="goStats">
      <div class="chip" id="goBest"><div class="k">Best</div><div class="v">0</div></div>
      <div class="chip" id="goLevel"><div class="k">Level</div><div class="v">1</div></div>
      <div class="chip" id="goDots"><div class="k">Dots</div><div class="v">0</div></div>
    </div>
    <button class="btn" id="btnAgain">PLAY AGAIN</button>
  </div>
</div>

<script>
"use strict";
(function(){

/* =====================================================================
   FLIP — one-tap arcade runner
   Bloop runs a closed loop. Tap flips direction. Collect dots, dodge red.
   ===================================================================== */

// ------------------------------ constants ------------------------------
var PATH_N = 512;                 // resampled points per track
var COL = {
  dot:'#5eeaff', dotCore:'#ffffff',
  bad:'#ff3b5c', badDim:'rgba(255,59,92,0.20)', warn:'#ffb43b',
  bloop:'#9dff6a', bloopDark:'#5fc72f',
  ice:'#7fd8ff'
};
var PU = {
  speed:     {icon:'⚡',  name:'SPEED',      color:'#ffd85e', dur:6.5},
  magnet:    {icon:'🧲',  name:'MAGNET',     color:'#ff7ac4', dur:7.5},
  freeze:    {icon:'❄️',  name:'FREEZE',     color:'#7fd8ff', dur:5.0},
  multiplier:{icon:'\u00d72', name:'DOUBLE',     color:'#c08bff', dur:9.0},
  ghost:     {icon:'👻',  name:'GHOST',      color:'#e8e8ff', dur:6.0}
};
var PU_KEYS = ['speed','magnet','freeze','multiplier','ghost'];

var BANNERS = {
  6:'FASTER!', 11:'RED BLOCKS AHEAD', 21:'THEY MOVE NOW',
  31:'THE ARENA SHIFTS', 41:'NEW PATHS', 51:'SPECIAL DOTS!',
  76:'ROTATING ARENA', 100:'EVERYTHING AT ONCE'
};

// ------------------------------ dom ------------------------------
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var $ = function(id){ return document.getElementById(id); };
var elHud=$('hud'), elScore=$('hScore'), elLevel=$('hLevel'), elBest=$('hBest');
var elPu=$('pu'), elPuIcon=$('puIcon'), elPuName=$('puName'), elPuFill=$('puFill');
var elHint=$('hint'), elBanner=$('banner');
var scStart=$('scStart'), scOver=$('scOver');
var goTitle=$('goTitle'), goScore=$('goScore');
var goBest=$('goBest').querySelector('.v');
var goLevel=$('goLevel').querySelector('.v');
var goDots=$('goDots').querySelector('.v');

// ------------------------------ viewport ------------------------------
var W=0,H=0,CX=0,CY=0,R=150,TRACK_W=26,DPR=1;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  // Cap total canvas pixels so big retina screens (iPads, 5K monitors) stay at 60fps.
  // Phones sit well under this, so they keep full sharpness.
  var need = W * H * DPR * DPR, MAXPX = 2400000;
  if(need > MAXPX) DPR = Math.max(1, DPR * Math.sqrt(MAXPX / need));
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2 + (H > 640 ? 8 : 0);
  R = Math.max(84, Math.min(300, Math.min(W*0.44, H*0.34)));
  TRACK_W = Math.max(20, Math.min(38, R*0.20));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize,120); });
resize();

// ------------------------------ path system ------------------------------
function sampleParam(fn, m){
  m = m || 2400; var out = [];
  for (var i=0;i<m;i++) out.push(fn(i/m*Math.PI*2));
  return out;
}
function polar(fn){ return sampleParam(function(t){ var r=fn(t); return [Math.cos(t)*r, Math.sin(t)*r]; }); }
function superE(n, ax, ay){
  return sampleParam(function(t){
    var c=Math.cos(t), s=Math.sin(t), p=2/n;
    return [ax*(c<0?-1:1)*Math.pow(Math.abs(c),p), ay*(s<0?-1:1)*Math.pow(Math.abs(s),p)];
  });
}
function normalize(pts){
  var mx=0.0001,i;
  for(i=0;i<pts.length;i++) mx = Math.max(mx, Math.abs(pts[i][0]), Math.abs(pts[i][1]));
  var out=[]; for(i=0;i<pts.length;i++) out.push([pts[i][0]/mx, pts[i][1]/mx]);
  return out;
}
function resample(pts, n){
  var m=pts.length, cum=new Float64Array(m+1), i;
  for(i=1;i<=m;i++){
    var a=pts[i-1], b=pts[i%m];
    cum[i]=cum[i-1]+Math.hypot(b[0]-a[0], b[1]-a[1]);
  }
  var total=cum[m]; if(total<=0) total=1;
  var out=[], j=0;
  for(i=0;i<n;i++){
    var target = total*i/n;
    while(j < m-1 && cum[j+1] < target) j++;
    var seg = cum[j+1]-cum[j];
    var f = seg>0 ? (target-cum[j])/seg : 0;
    var p=pts[j], q=pts[(j+1)%m];
    out.push([p[0]+(q[0]-p[0])*f, p[1]+(q[1]-p[1])*f]);
  }
  return out;
}
var SHAPES = {
  sq:      function(){ return superE(6, 1, 1); },
  wide:    function(){ return superE(6, 1.18, 0.78); },
  tall:    function(){ return superE(6, 0.78, 1.16); },
  circle:  function(){ return superE(2, 1, 1); },
  diamond: function(){ return superE(1.35, 1, 1); },
  peanut:  function(){ return polar(function(t){ return 0.80+0.20*Math.cos(2*t); }); },
  clover:  function(){ return polar(function(t){ return 0.72+0.28*Math.cos(4*t); }); },
  star5:   function(){ return polar(function(t){ return 0.78+0.22*Math.cos(5*t); }); },
  gear:    function(){ return polar(function(t){ return 0.90+0.10*Math.cos(6*t); }); },
  fig8:    function(){ return sampleParam(function(t){ return [Math.cos(t)*0.98, Math.sin(2*t)*0.86]; }); }
};
var shapeCache = {};
function unitShape(name){
  if(!shapeCache[name]) shapeCache[name] = resample(normalize(SHAPES[name]()), PATH_N);
  return shapeCache[name];
}
function shapeForLevel(L){
  if(L < 31) return 'sq';
  if(L < 41) return ['wide','circle','tall','diamond','sq'][Math.floor((L-31)/2) % 5];
  if(L < 51) return ['peanut','clover','fig8','star5'][Math.floor((L-41)/3) % 4];
  if(L < 76) return ['sq','clover','circle','fig8','wide','star5','diamond','peanut'][(L-51) % 8];
  return ['sq','clover','fig8','star5','gear','wide','circle','peanut','tall','diamond'][(L-76) % 10];
}

// current track geometry
var shapeFrom = unitShape('sq'), shapeTo = unitShape('sq'), shapeName='sq';
var morph = 1;                 // 0..1
var unitPts = shapeFrom;
var worldPts = new Array(PATH_N);
var worldCum = new Float64Array(PATH_N+1);
var perim = 1;
var arenaRot = 0, arenaRotSpeed = 0;
var tmpX = new Float64Array(PATH_N), tmpY = new Float64Array(PATH_N);
var fitCur = 1;   // shrink factor that keeps a rotated arena inside the screen

for(var _i=0;_i<PATH_N;_i++) worldPts[_i]=[0,0];

function easeIO(x){ return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }

function buildWorld(dt, snap){
  var i, a, b, ca=Math.cos(arenaRot), sa=Math.sin(arenaRot);
  var e = morph < 1 ? easeIO(morph) : 1;
  var mx = 0.0001, my = 0.0001, mr2 = 0.0001, ux, uy;

  for(i=0;i<PATH_N;i++){
    if(morph < 1){ a=shapeFrom[i]; b=shapeTo[i]; ux=a[0]+(b[0]-a[0])*e; uy=a[1]+(b[1]-a[1])*e; }
    else { b=shapeTo[i]; ux=b[0]; uy=b[1]; }
    var rx = ux*ca - uy*sa, ry = ux*sa + uy*ca;
    tmpX[i] = rx; tmpY[i] = ry;
    if(rx > mx) mx = rx; else if(-rx > mx) mx = -rx;
    if(ry > my) my = ry; else if(-ry > my) my = -ry;
    var q = ux*ux + uy*uy; if(q > mr2) mr2 = q;
  }

  // A square's corners swing out to ~1.26x its half-width when the arena turns,
  // so fit by the shape's outer radius while it is rotating (constant size, no
  // pulsing) and by its actual rotated bounds when it is still.
  var target = arenaRotSpeed ? 1/Math.sqrt(mr2) : 1/Math.max(mx, my);
  if(snap) fitCur = target;
  else fitCur += (target - fitCur) * Math.min(1, (dt||0) * 3.2);

  var k = R * fitCur;
  for(i=0;i<PATH_N;i++){
    worldPts[i][0] = CX + tmpX[i]*k;
    worldPts[i][1] = CY + tmpY[i]*k;
  }

  worldCum[0]=0;
  for(i=1;i<=PATH_N;i++){
    var pp=worldPts[i-1], qq=worldPts[i%PATH_N];
    worldCum[i]=worldCum[i-1]+Math.hypot(qq[0]-pp[0], qq[1]-pp[1]);
  }
  perim = Math.max(1, worldCum[PATH_N]);
}
function ptAt(s){
  s = s - Math.floor(s);
  var x = s*PATH_N, i = Math.floor(x), f = x-i;
  var a = worldPts[i % PATH_N], b = worldPts[(i+1) % PATH_N];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
}
function angAt(s){
  s = s - Math.floor(s);
  var i = Math.floor(s*PATH_N);
  var a = worldPts[(i-1+PATH_N) % PATH_N], b = worldPts[(i+2) % PATH_N];
  return Math.atan2(b[1]-a[1], b[0]-a[0]);
}
function dS(a,b){ var d=b-a; d-=Math.round(d); return d; }        // signed, -0.5..0.5
function aS(a,b){ return Math.abs(dS(a,b)); }                       // absolute

// ------------------------------ difficulty ------------------------------
function levelFromDots(d){
  if(d < 20)  return 1  + Math.floor(d/2);            // L1..L10
  if(d < 140) return 11 + Math.floor((d-20)/3);       // L11..L50
  return 51 + Math.floor((d-140)/4);                  // L51+
}
function speedFor(L){
  if(L <= 5)  return 168;
  if(L <= 10) return 168 + (L-5)*11;                  // 223 @ L10
  return Math.min(575, 223 + 34*Math.sqrt(L-10));     // 328@20 372@30 434@50 540@100
}
function nBlink(L){ return L < 11 ? 0 : Math.min(5, 1 + Math.floor((L-11)/5)); }
function nRun(L){   return L < 21 ? 0 : Math.min(2, 1 + Math.floor((L-21)/12)); }
function nSweep(L){ return L < 76 ? 0 : Math.min(2, 1 + Math.floor((L-76)/14)); }
function puChance(L){ return L < 51 ? 0 : 0.20; }

// ------------------------------ state ------------------------------
var S = {};
var state = 'menu';           // menu | play | dying | over | paused
var best = 0;
try { best = parseInt(localStorage.getItem('flip_best')||'0',10) || 0; } catch(e){ best = 0; }
elBest.textContent = best;
goBest.textContent = best;

function resetRun(){
  S = {
    s: 0.25, dir: 1, speed: speedFor(1),
    score: 0, dots: 0, level: 1, combo: 0, comboT: 0,
    t: 0, grace: 1.0,
    flipT: 99, squash: 0,
    trail: [], parts: [], pops: [],
    dotList: [], blinks: [], runs: [], sweeps: [],
    pu: null, puT: 0,
    shake: 0, hue: 0, dieT: 0,
    hadSpecial: false
  };
  shapeName = 'sq';
  shapeFrom = shapeTo = unitShape('sq');
  morph = 1; arenaRot = 0; arenaRotSpeed = 0;
  buildWorld(0, true);
  layoutHazards(1, true);
  for(var i=0;i<4;i++) spawnDot();
}

// ------------------------------ hazards ------------------------------
function layoutHazards(L, hard){
  var nb = nBlink(L), nr = nRun(L), nsw = nSweep(L);
  var total = nb + nr;
  var blinks = [], runs = [];
  if(total > 0){
    // one hazard per evenly-spaced slot => guaranteed safe gaps between them
    var order = [];
    for(var i=0;i<nb;i++) order.push('b');
    for(var j=0;j<nr;j++) order.push('r');
    for(var k=order.length-1;k>0;k--){ var m=Math.floor(Math.random()*(k+1)); var tmp=order[k]; order[k]=order[m]; order[m]=tmp; }
    var slot = 1/total;
    var span = Math.min(0.15, slot*0.34);
    var off = Math.random();
    for(var q=0;q<total;q++){
      var base = off + (q + 0.5)*slot + (Math.random()-0.5)*slot*0.22;
      base -= Math.floor(base);
      if(order[q]==='b'){
        var per = Math.max(1.05, 2.65 - L*0.012);
        blinks.push({
          s: base, age: 0,
          period: per,
          solidFrac: Math.min(0.55, 0.32 + L*0.0030),
          phase: per * ((blinks.length + 0.5) / Math.max(1, nb)) + Math.random()*per*0.12,
          solid: false, held: false, warn: 0,
          width: 1 + Math.min(0.32, Math.max(0,(L-31))*0.009)
        });
      } else {
        var sp = (0.30 + Math.min(0.45, (L-21)*0.012));   // as a fraction of player speed
        runs.push({
          c: base, span: span, p: base, d: Math.random()<0.5?1:-1,
          v: sp, age: 0
        });
      }
    }
  }
  var sweeps = [];
  for(var w=0; w<nsw; w++){
    sweeps.push({ a: Math.random()*Math.PI*2, v: (0.42 + Math.min(0.75,(L-76)*0.012)) * (Math.random()<0.5?1:-1), age:0 });
  }

  // never drop a hazard right on top of the player
  if(state === 'play' && !hard){
    var shift = 0, tries = 0;
    while(tries++ < 24){
      var ok = true, z;
      for(z=0;z<blinks.length;z++) if(aS(S.s, blinks[z].s+shift) < 0.075) ok=false;
      for(z=0;z<runs.length;z++)   if(aS(S.s, runs[z].c+shift) < runs[z].span + 0.055) ok=false;
      if(ok) break;
      shift += 0.045;
    }
    for(var y=0;y<blinks.length;y++){ blinks[y].s += shift; blinks[y].s -= Math.floor(blinks[y].s); }
    for(var x=0;x<runs.length;x++){ runs[x].c += shift; runs[x].c -= Math.floor(runs[x].c); runs[x].p = runs[x].c; }
  }
  S.blinks = blinks; S.runs = runs; S.sweeps = sweeps;
}

function hazardBlocked(s, pad){
  pad = pad || 0.035;
  var i;
  for(i=0;i<S.blinks.length;i++) if(aS(s, S.blinks[i].s) < pad) return true;
  for(i=0;i<S.runs.length;i++)   if(aS(s, S.runs[i].c) < S.runs[i].span + pad*0.6) return true;
  for(i=0;i<S.dotList.length;i++) if(aS(s, S.dotList[i].s) < 0.045) return true;
  return false;
}
function spawnDot(){
  var s = 0, tries = 0, bestS = Math.random(), bestGap = -1;
  for(tries = 0; tries < 14; tries++){
    s = Math.random();
    if(hazardBlocked(s) || aS(s, S.s) < 0.06) continue;
    var gap = 1;
    for(var g=0; g<S.dotList.length; g++) gap = Math.min(gap, aS(s, S.dotList[g].s));
    if(gap > bestGap){ bestGap = gap; bestS = s; }
    if(bestGap > 0.18) break;
  }
  s = bestS;
  var kind = null;
  if(!S.hadSpecial && Math.random() < puChance(S.level)){
    kind = PU_KEYS[Math.floor(Math.random()*PU_KEYS.length)];
    S.hadSpecial = true;
  }
  S.dotList.push({ s:s, kind:kind, t:Math.random()*6, born:0 });
}

// ------------------------------ audio ------------------------------
var AC = null, muted = false;
try { muted = localStorage.getItem('flip_mute') === '1'; } catch(e){}
$('sound').textContent = muted ? '🔇' : '🔊';
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slide){
  if(muted) return;
  var a = ac(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), a.currentTime+dur);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.16, a.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur+0.03);
  }catch(e){}
}
function sfxCollect(n){ tone(500 + Math.min(11,n)*32, 0.085, 'triangle', 0.15); }
function sfxFlip(){ tone(300, 0.055, 'square', 0.05, 470); }
function sfxPower(){ [0,90,180].forEach(function(d,i){ setTimeout(function(){ tone(560*Math.pow(1.26,i), 0.13, 'triangle', 0.14); }, d); }); }
function sfxLevel(){ tone(680,0.09,'sine',0.12); setTimeout(function(){ tone(900,0.15,'sine',0.12); },95); }
function sfxDie(){ tone(240, 0.55, 'sawtooth', 0.2, 55); }
function buzz(ms){ try{ if(navigator.vibrate && !muted) navigator.vibrate(ms); }catch(e){} }

      life:1, decay:1.6+Math.random()*1.4, size:2+Math.random()*3.4, c:color });
  }
}
function pop(x,y,txt,color){ S.pops.push({x:x,y:y,txt:txt,c:color,life:1}); }

// ------------------------------ update ------------------------------
function setLevel(L){
  if(L === S.level) return;
  var prev = S.level;
  S.level = L;
  S.speed = speedFor(L);
  var want = shapeForLevel(L);
  if(want !== shapeName){
    shapeFrom = unitPtsSnapshot();
    shapeTo = unitShape(want);
    shapeName = want; morph = 0;
  }
  arenaRotSpeed = L >= 76 ? (0.07 + Math.min(0.18, (L-76)*0.0022)) * (Math.floor(L/7)%2 ? 1 : -1) : 0;
  layoutHazards(L, false);
  sfxLevel();
  if(BANNERS[L]) banner(BANNERS[L]);
  else if(L % 10 === 0) banner('LEVEL ' + L);
  if(prev < L) S.shake = Math.max(S.shake, 3);
}
function unitPtsSnapshot(){
  if(morph >= 1) return shapeTo;
  var e = easeIO(morph), out = [];
  for(var i=0;i<PATH_N;i++){
    var a=shapeFrom[i], b=shapeTo[i];
    out.push([a[0]+(b[0]-a[0])*e, a[1]+(b[1]-a[1])*e]);
  }
  return out;
}

function update(dt){
  S.t += dt;
  if(S.grace > 0) S.grace -= dt;
  if(morph < 1) morph = Math.min(1, morph + dt/1.25);
  if(arenaRotSpeed) arenaRot += arenaRotSpeed*dt;
  buildWorld(dt);

  // --- powerup timer
  var isGhost=false, isFrozen=false, isMagnet=false, mult=1, spdMul=1;
  if(S.pu){
    S.puT -= dt;
    if(S.puT <= 0){ S.pu = null; elPu.classList.remove('on'); }
    else {
      var k = S.pu;
      if(k==='ghost') isGhost = true;
      else if(k==='freeze') isFrozen = true;
      else if(k==='magnet') isMagnet = true;
      else if(k==='multiplier') mult = 2;
      else if(k==='speed'){ spdMul = 1.42; mult = 1.5; }
      elPuFill.style.width = Math.max(0, Math.min(100, S.puT/PU[k].dur*100)) + '%';
    }
  }

  // --- move Bloop
  var pxSpeed = S.speed * (R/150) * spdMul;
  S.s += S.dir * pxSpeed * dt / perim;
  S.s -= Math.floor(S.s);
  S.flipT += dt;
  S.squash = Math.max(0, S.squash - dt*4.2);

  var pp = ptAt(S.s);
  S.trail.push({x:pp[0], y:pp[1], l:1});
  if(S.trail.length > 16) S.trail.shift();
  for(var ti=0; ti<S.trail.length; ti++) S.trail[ti].l -= dt*2.6;

  // --- survival score
  S.scoreAcc = (S.scoreAcc||0) + dt;
  while(S.scoreAcc >= 1){ S.scoreAcc -= 1; S.score += 1; }

  // --- combo decay
  if(S.combo > 0){ S.comboT -= dt; if(S.comboT <= 0) S.combo = 0; }

  // --- dots
  var pRad = 13*(R/150);
  for(var i=S.dotList.length-1; i>=0; i--){
    var d = S.dotList[i]; d.t += dt; d.born = Math.min(1, d.born + dt*4);
    if(isMagnet){
      var diff = dS(d.s, S.s);
      if(Math.abs(diff)*perim < 190*(R/150)) d.s += diff*Math.min(1, dt*4.6);
    }
    var need = (pRad + (d.kind?13:9)*(R/150));
    if(aS(S.s, d.s)*perim < need){
      S.dotList.splice(i,1);
      var dp = ptAt(d.s);
      if(d.kind){
        S.pu = d.kind; S.puT = PU[d.kind].dur; S.hadSpecial = false;
        elPuIcon.textContent = PU[d.kind].icon;
        elPuName.textContent = PU[d.kind].name;
        elPu.style.color = PU[d.kind].color;
        elPuFill.style.background = PU[d.kind].color;
        elPu.classList.add('on');
        burst(dp[0], dp[1], PU[d.kind].color, 26, 3.4);
        pop(dp[0], dp[1], PU[d.kind].name+'!', PU[d.kind].color);
        sfxPower(); buzz([12,40,12]);
        S.shake = Math.max(S.shake, 4);
      } else {
        S.combo++; S.comboT = 3.2;
        var gain = Math.round((10 + S.level) * mult);
        S.score += gain;
        S.dots++;
        burst(dp[0], dp[1], COL.dot, 12, 2.4);
        pop(dp[0], dp[1], '+'+gain, '#ffffff');
        sfxCollect(S.combo); buzz(10);
      }
      spawnDot();
      setLevel(levelFromDots(S.dots));
    }
  }
  while(S.dotList.length < 4) spawnDot();

  // --- blinkers
  var j, hit = false;
  for(j=0;j<S.blinks.length;j++){
    var b = S.blinks[j]; b.age += dt;
    if(!isFrozen) b.phase += dt;
    var ph = (b.phase % b.period) / b.period;
    var solidStart = 1 - b.solidFrac;
    var wantSolid = ph >= solidStart;
    var nearPlayer = aS(S.s, b.s)*perim < (pRad + 20*(R/150) + 6);
    if(wantSolid && !b.solid && nearPlayer && !isGhost){ b.held = true; }
    if(!nearPlayer) b.held = false;
    if(isFrozen) { wantSolid = wantSolid && b.solid; }
    b.solid = wantSolid && !b.held && b.age > 0.55;
    b.warn = (!b.solid && ph > solidStart - 0.45/b.period && ph < solidStart) ? 1 : (b.held ? 1 : 0);
    if(b.solid && !isGhost && S.grace <= 0 && aS(S.s, b.s)*perim < (pRad*0.82 + 17*(R/150)*b.width)) hit = true;
  }

  // --- runners
  for(j=0;j<S.runs.length;j++){
    var r = S.runs[j]; r.age += dt;
    if(!isFrozen){
      r.p += r.d * (S.speed*r.v) * (R/150) * dt / perim;
      if(dS(r.c, r.p) > r.span){ r.p = r.c + r.span; r.d = -1; }
      else if(dS(r.c, r.p) < -r.span){ r.p = r.c - r.span; r.d = 1; }
      r.p -= Math.floor(r.p);
    }
    if(!isGhost && S.grace <= 0 && r.age > 0.55 && aS(S.s, r.p)*perim < (pRad*0.82 + 19*(R/150))) hit = true;
  }

  // --- sweepers
  for(j=0;j<S.sweeps.length;j++){
    var w = S.sweeps[j]; w.age += dt;
    if(!isFrozen) w.a += w.v*dt;
    if(!isGhost && S.grace <= 0 && w.age > 0.7){
      var dx = pp[0]-CX, dy = pp[1]-CY;
      var ca = Math.cos(w.a), sa = Math.sin(w.a);
      var proj = dx*ca + dy*sa;
      var perp = Math.abs(-dx*sa + dy*ca);
      if(proj > 0 && perp < (10 + pRad*0.7)) hit = true;
    }
  }

  if(hit) die();

  // --- particles / pops
  for(i=S.parts.length-1;i>=0;i--){
    var p = S.parts[i];
    p.x += p.vx*dt*60; p.y += p.vy*dt*60;
    p.vx *= 0.94; p.vy = p.vy*0.94 + 0.055;
    p.life -= dt*p.decay;
    if(p.life <= 0) S.parts.splice(i,1);
  }
  for(i=S.pops.length-1;i>=0;i--){
    var o = S.pops[i]; o.y -= dt*42; o.life -= dt*1.35;
    if(o.life <= 0) S.pops.splice(i,1);
  }
  if(S.shake > 0) S.shake = Math.max(0, S.shake - dt*22);
  syncHud();
}

function die(){
  if(state !== 'play') return;
  state = 'dying'; S.dieT = 0; S.shake = 17;
  var p = ptAt(S.s);
  burst(p[0], p[1], COL.bloop, 26, 4.6);
  burst(p[0], p[1], COL.bad, 22, 5.4);
  sfxDie(); buzz([30,50,90]);
  elPu.classList.remove('on');
}

// ------------------------------ render ------------------------------
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x-w/2+r, y-h/2);
  c.arcTo(x+w/2, y-h/2, x+w/2, y+h/2, r);
  c.arcTo(x+w/2, y+h/2, x-w/2, y+h/2, r);
  c.arcTo(x-w/2, y+h/2, x-w/2, y-h/2, r);
  c.arcTo(x-w/2, y-h/2, x+w/2, y-h/2, r);
  c.closePath();
}

function drawBackground(){
  var hue = (S.level ? S.level : 1);
  var g = ctx.createRadialGradient(CX, CY*0.86, R*0.1, CX, CY, Math.max(W,H)*0.82);
  var a = 236 + Math.sin(hue*0.21)*14;
  g.addColorStop(0, 'hsl(' + (266 + Math.sin(hue*0.17)*26) + ',70%,38%)');
  g.addColorStop(0.52,'hsl(' + (258 + Math.sin(hue*0.11)*18) + ',66%,24%)');
  g.addColorStop(1, 'hsl(' + (250) + ',62%,12%)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // soft glow behind arena
  var g2 = ctx.createRadialGradient(CX,CY,R*0.2,CX,CY,R*1.5);
  g2.addColorStop(0,'rgba(150,120,255,0.26)');
  g2.addColorStop(1,'rgba(120,90,255,0)');
  ctx.fillStyle = g2; ctx.fillRect(CX-R*1.6, CY-R*1.6, R*3.2, R*3.2);
}

function tracePath(){
  ctx.beginPath();
  ctx.moveTo(worldPts[0][0], worldPts[0][1]);
  for(var i=1;i<PATH_N;i++) ctx.lineTo(worldPts[i][0], worldPts[i][1]);
  ctx.closePath();
}
function drawTrack(){
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  tracePath();
  ctx.strokeStyle = 'rgba(8,3,26,0.55)'; ctx.lineWidth = TRACK_W + 12; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.085)'; ctx.lineWidth = TRACK_W; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.20)'; ctx.lineWidth = 2; ctx.stroke();
}

function drawDots(){
  for(var i=0;i<S.dotList.length;i++){
    var d = S.dotList[i], p = ptAt(d.s);
    var puls = 1 + Math.sin(d.t*4.2)*0.13;
    var sc = (R/150) * d.born * puls;
    if(d.kind){
      var c = PU[d.kind].color;
      ctx.save();
      ctx.translate(p[0], p[1]);
      ctx.rotate(Math.sin(d.t*2.2)*0.18);
      ctx.shadowColor = c; ctx.shadowBlur = 24*sc;
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(0,0,13*sc,0,6.2832); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath(); ctx.arc(0,0,10*sc,0,6.2832); ctx.fill();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle = '#20104a';
      if(d.kind === 'multiplier'){
        ctx.font = '700 ' + (12*sc) + 'px Fredoka, system-ui, sans-serif';
        ctx.fillText('\u00d72', 0, 0.5*sc);
      } else {
        ctx.font = (13*sc)+'px system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
        ctx.fillText(PU[d.kind].icon, 0, 0.5*sc);
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.shadowColor = COL.dot; ctx.shadowBlur = 18*sc;
      ctx.fillStyle = COL.dot;
      ctx.beginPath(); ctx.arc(p[0],p[1], 8.5*sc, 0, 6.2832); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p[0]-1.4*sc, p[1]-1.6*sc, 3.4*sc, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }
}

function drawBlock(p, ang, sc, solid, warn, kind, dirArrow){
  ctx.save();
  ctx.translate(p[0], p[1]); ctx.rotate(ang);
  var len = (kind==='run' ? 34 : 30) * sc;
  var wid = TRACK_W * 0.96;
  if(solid){
    ctx.shadowColor = COL.bad; ctx.shadowBlur = 20*sc;
    var g = ctx.createLinearGradient(0,-wid/2,0,wid/2);
    g.addColorStop(0,'#ff6b83'); g.addColorStop(1,'#e01238');
    ctx.fillStyle = g;
    roundRect(ctx, 0,0, len, wid, Math.min(9*sc, wid/2)); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(ctx, 0,-wid*0.22, len*0.82, wid*0.28, 4*sc); ctx.fill();
    if(dirArrow){
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      for(var k=-1;k<=1;k++){
        var x = k*len*0.24;
        ctx.beginPath();
        ctx.moveTo(x - 3.5*sc*dirArrow, -4.5*sc);
        ctx.lineTo(x + 3.5*sc*dirArrow, 0);
        ctx.lineTo(x - 3.5*sc*dirArrow, 4.5*sc);
        ctx.closePath(); ctx.fill();
      }
    }
  } else {
    ctx.strokeStyle = warn ? 'rgba(255,180,59,'+(0.55+Math.sin(performance.now()/60)*0.35)+')' : 'rgba(255,59,92,0.30)';
    ctx.lineWidth = warn ? 3 : 2;
    ctx.setLineDash(warn ? [] : [5,5]);
    roundRect(ctx, 0,0, len, wid, Math.min(9*sc, wid/2)); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawHazards(){
  var sc = R/150, j;
  for(j=0;j<S.blinks.length;j++){
    var b = S.blinks[j];
    drawBlock(ptAt(b.s), angAt(b.s), sc*b.width, b.solid, b.warn, 'blink', 0);
  }
  for(j=0;j<S.runs.length;j++){
    var r = S.runs[j];
    // patrol rail
    ctx.save();
    ctx.strokeStyle = 'rgba(255,59,92,0.10)'; ctx.lineWidth = TRACK_W*0.72; ctx.lineCap='round';
    ctx.beginPath();
    var steps = 22;
    for(var k=0;k<=steps;k++){
      var ss = r.c - r.span + (2*r.span)*k/steps;
      var pt = ptAt(ss);
      if(k===0) ctx.moveTo(pt[0],pt[1]); else ctx.lineTo(pt[0],pt[1]);
    }
    ctx.stroke(); ctx.restore();
    drawBlock(ptAt(r.p), angAt(r.p), sc, r.age > 0.55, 0, 'run', r.d);
  }
  for(j=0;j<S.sweeps.length;j++){
    var w = S.sweeps[j];
    var len = R*1.55;
    var ex = CX + Math.cos(w.a)*len, ey = CY + Math.sin(w.a)*len;
    ctx.save();
    var g = ctx.createLinearGradient(CX,CY,ex,ey);
    g.addColorStop(0,'rgba(255,59,92,0.05)');
    g.addColorStop(0.35,'rgba(255,59,92,0.55)');
    g.addColorStop(1,'rgba(255,59,92,0.85)');
    ctx.strokeStyle = g; ctx.lineCap='round';
    ctx.lineWidth = w.age > 0.7 ? 9 : 3;
    ctx.shadowColor = COL.bad; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.restore();
  }
}

function drawBloop(alive){
  var p = ptAt(S.s), ang = angAt(S.s);
  var sc = R/150;
  var ghost = S.pu === 'ghost';

  // trail
  for(var i=0;i<S.trail.length;i++){
    var t = S.trail[i]; if(t.l <= 0) continue;
    ctx.fillStyle = 'rgba(157,255,106,' + (t.l*0.20*(i/S.trail.length)) + ')';
    ctx.beginPath(); ctx.arc(t.x, t.y, 11*sc*(i/S.trail.length), 0, 6.2832); ctx.fill();
  }
  if(!alive) return;

  var sq = S.squash;
  var sx = 1 - sq*0.30, sy = 1 + sq*0.30;
  var bob = Math.sin(S.t*13)*1.6*sc;
  var rr = 16*sc;

  // body: squashed along the direction of travel
  ctx.save();
  ctx.translate(p[0], p[1] + bob);
  ctx.globalAlpha = ghost ? 0.62 : 1;
  ctx.save();
  ctx.rotate(ang);
  ctx.scale(sx, sy);
  ctx.shadowColor = ghost ? '#e8e8ff' : COL.bloop; ctx.shadowBlur = 22*sc;
  var g = ctx.createRadialGradient(-rr*0.32,-rr*0.38,rr*0.12,0,0,rr*1.3);
  g.addColorStop(0, ghost ? '#ffffff' : '#e2ffc4');
  g.addColorStop(0.55, ghost ? '#ddddff' : COL.bloop);
  g.addColorStop(1, ghost ? '#a8a8f0' : COL.bloopDark);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,rr,0,6.2832); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = ghost ? 'rgba(255,255,255,0.9)' : 'rgba(28,70,10,0.55)';
  ctx.lineWidth = 2*sc;
  ctx.beginPath(); ctx.arc(0,0,rr-1*sc,0,6.2832); ctx.stroke();
  ctx.restore();

  // face: always upright so Bloop stays readable, pupils lean the way it runs
  var look = Math.cos(ang) * S.dir, lookY = Math.sin(ang) * S.dir;
  var ex = rr*0.36, ey = -rr*0.12, er = rr*0.29;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-ex, ey, er, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc( ex, ey, er, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#1b0f3d';
  var pr = er*0.55, px = look*er*0.40, py = lookY*er*0.40;
  ctx.beginPath(); ctx.arc(-ex+px, ey+py, pr, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc( ex+px, ey+py, pr, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-ex+px-pr*0.3, ey+py-pr*0.35, pr*0.34, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc( ex+px-pr*0.3, ey+py-pr*0.35, pr*0.34, 0, 6.2832); ctx.fill();

  ctx.strokeStyle = '#1b0f3d'; ctx.lineWidth = 2.1*sc; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0, rr*0.20, rr*0.34, 0.42, Math.PI-0.42); ctx.stroke();

  ctx.globalAlpha = 1;
  ctx.restore();

  // flip ring
  if(S.flipT < 0.4){
    var f = S.flipT/0.4;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.7*(1-f)) + ')';
    ctx.lineWidth = 3*(1-f);
    ctx.beginPath(); ctx.arc(p[0], p[1], (14 + f*30)*sc, 0, 6.2832); ctx.stroke();
  }
}

function drawFx(){
  var i;
  for(i=0;i<S.parts.length;i++){
    var p = S.parts[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*Math.max(0.2,p.life), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(i=0;i<S.pops.length;i++){
    var o = S.pops[i];
    ctx.globalAlpha = Math.max(0, Math.min(1, o.life));
    ctx.font = '700 ' + (16*(R/150)) + 'px Fredoka, system-ui, sans-serif';
    ctx.fillStyle = o.c;
    ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=8;
    var edge = 44*(R/150);
    ctx.fillText(o.txt, Math.max(edge, Math.min(W - edge, o.x)), o.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha = 1;

  if(S.combo >= 3 && state === 'play'){
    ctx.font = '700 ' + (15*(R/150)) + 'px Fredoka, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,216,94,0.9)';
    ctx.fillText('COMBO x' + S.combo, CX, CY + R + 40);
  }
}

function drawFrozenTint(){
  if(S.pu !== 'freeze') return;
  ctx.fillStyle = 'rgba(127,216,255,0.10)';
  ctx.fillRect(0,0,W,H);
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  var sh = S.shake || 0;
  if(sh > 0.2) ctx.translate((Math.random()-0.5)*sh, (Math.random()-0.5)*sh);
  drawBackground();
  drawTrack();
  drawHazards();
  drawDots();
  drawBloop(state !== 'dying' || S.dieT < 0.08);
  drawFx();
  drawFrozenTint();
}

// menu idle demo state
function menuTick(dt){
  S.t += dt;
  if(morph < 1) morph = Math.min(1, morph + dt/1.25);
  buildWorld(dt);
  S.s += 0.10*dt; S.s -= Math.floor(S.s);
  var p = ptAt(S.s);
  S.trail.push({x:p[0],y:p[1],l:1});
  if(S.trail.length>16) S.trail.shift();
  for(var i=0;i<S.trail.length;i++) S.trail[i].l -= dt*2.6;
  for(i=S.dotList.length-1;i>=0;i--){
    var d=S.dotList[i]; d.t+=dt; d.born=Math.min(1,d.born+dt*4);
    if(aS(S.s,d.s)*perim < 22*(R/150)){ S.dotList.splice(i,1); burst(p[0],p[1],COL.dot,10,2); spawnDot(); }
  }
  for(i=S.parts.length-1;i>=0;i--){
    var q=S.parts[i]; q.x+=q.vx*dt*60; q.y+=q.vy*dt*60; q.vx*=0.94; q.vy=q.vy*0.94+0.055;
    q.life-=dt*q.decay; if(q.life<=0) S.parts.splice(i,1);
  }
  S.pops.length = 0;
}

// ------------------------------ loop ------------------------------
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - last)/1000);
  last = now;

  if(state === 'play') update(dt);
  else if(state === 'dying'){
    S.dieT += dt;
    buildWorld(dt);
    for(var i=S.parts.length-1;i>=0;i--){
      var p=S.parts[i]; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vx*=0.94; p.vy=p.vy*0.94+0.055;
      p.life-=dt*p.decay; if(p.life<=0) S.parts.splice(i,1);
    }
    if(S.shake>0) S.shake = Math.max(0, S.shake - dt*22);
    if(S.dieT > 0.75) gameOver();
  }
  else if(state !== 'paused') menuTick(dt);

  render();
  requestAnimationFrame(frame);
}

// boot
resetRun();
state = 'menu';
requestAnimationFrame(function(t){ last = t; frame(t); });

// expose a tiny hook for automated smoke-testing
window.__FLIP = {
  get state(){ return state; },
  get S(){ return S; },
  start: start,
  flip: flip,
  setDots: function(n){ S.dots = n; setLevel(levelFromDots(n)); },
  levelFromDots: levelFromDots,
  shapeForLevel: shapeForLevel
};

})();
</script>
</body>
